name: Cleanup Old Releases

on:
  schedule:
    # Every Monday at 03:00 CST (UTC Sunday 19:00)
    - cron: '0 19 * * 0'
  workflow_dispatch:

# Write permission is required to delete releases and tags
permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete old releases keeping only latest 5
        env:
          # gh CLI defaults to the working directory git remote;
          # explicitly setting GH_REPO allows skipping git checkout
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RETAIN=5

          # Only non-draft releases are counted to avoid deleting unpublished drafts;
          # limit is set high to prevent default 100-item pagination truncation
          OLD_TAGS=$(gh release list --limit 1000 \
            --json tagName,publishedAt,isDraft \
            --jq "[.[] | select(.isDraft | not)] | sort_by(.publishedAt) | reverse | .[$RETAIN:] | .[].tagName")

          if [ -z "$OLD_TAGS" ]; then
            echo "Non-draft releases do not exceed ${RETAIN}. No cleanup needed."
            exit 0
          fi

          echo "Releases to clean up:"
          echo "$OLD_TAGS"

          # Delete one by one and accumulate failures so a single failure does not abort the entire run
          failed=0
          while IFS= read -r tag; do
            if [ -z "$tag" ]; then
              continue
            fi
            echo "Deleting release and its tag: $tag"
            if gh release delete "$tag" --yes --cleanup-tag; then
              echo "Deleted: $tag"
            else
              echo "::warning::Failed to delete $tag"
              failed=$((failed + 1))
            fi
          done <<< "$OLD_TAGS"

          if [ "$failed" -ne 0 ]; then
            echo "::error::Failed to delete ${failed} release(s)"
            exit 1
          fi

          echo "Cleanup complete. Kept the latest ${RETAIN} release(s)."